
<html>
<body>
<div style="color:red;font-size:50px;">
<script>
silnia_koniec=parseFloat(prompt("z czego silnia",""));
if(silnia_koniec==0){silnia_pol=1;}
else
{var silnia_pol=1;
for(i=1;i<=silnia_koniec;i++){
silnia_pol=silnia_pol*i;
}
}
document.write(silnia_koniec+"!="+silnia_pol);
</script>
</div>
</body>
</html>
